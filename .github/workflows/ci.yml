name: CI-PIPELINE-TP

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dependances
        run: pip install -r requirements.txt
      
      - name: Installer flake8
        run: pip install flake8 

      - name: Lancer Linter
        run: |
          flake8 app --count --select=E9,F63,F7,F82,F841 --show-source --statistics
          flake8 app --count --max-complexity=10 --max-line-length=127 --statistics
          flake8 tests --count --max-line-length=127 --statistics
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dependances
        run: pip install -r requirements.txt
      - name: Executer pytest
        run: pytest tests/ -v --cov=src
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      
      - name: Installation Python 
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les outils de build
        run: |
          pip install --upgrade pip
          pip install build twine
        
      - name: Construire le package Python
        run: python -m build
      
      - name: Upload du package comme artefact
        uses: actions/upload-artifact@v6
        with:
          name: python-package
          path: dist/
          retention-days: 30

     
                

         
      
   
